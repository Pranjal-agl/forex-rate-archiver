name: probe-sources
on:
  push:
    branches: [claude/probe-sources]
    paths: [probe.py, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests selenium
      - run: python probe.py
      - name: commit snapshots back to this throwaway branch
        if: always()
        run: |
          git config user.name probe-bot && git config user.email probe@users.noreply.github.com
          git add probe_out && git commit -m "probe output" && git push
