name: Daily Forex Scrape

on:
  schedule:
    # 05:23 UTC = 10:53 IST: after HDFC (~09:30 IST) and ICICI (~10:15 IST) publish.
    # Off the hour on purpose; GitHub delays jobs scheduled at :00.
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      banks:
        description: "Sources to fetch (space separated)"
        default: "sbi hdfc icici"

permissions:
  contents: write   # commit the archive
  issues: write     # open/close the alert issue

concurrency:
  group: forex-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ALERT_LABEL: pipeline-alert
      GH_TOKEN: ${{ github.token }}
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Chrome is preinstalled on ubuntu-latest; Selenium Manager fetches the matching driver.
      - name: Install
        run: pip install .

      - name: Run pipeline
        id: run
        run: |
          set +e
          forex-archiver run --trigger "${{ github.event_name }}" --banks ${{ inputs.banks || 'sbi hdfc icici' }} 2>&1 | tee archiver.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ -f run_report.json ]; then
            echo "needs_alert=$(jq -r .needs_alert run_report.json)" >> "$GITHUB_OUTPUT"
            cat run_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            # The pipeline crashed before it could write a report (e.g. an import error). That is
            # the failure that went unnoticed for six months, so it must alert.
            echo "needs_alert=true" >> "$GITHUB_OUTPUT"
            { echo "### ❌ Pipeline crashed before writing a report"; echo '```'; tail -40 archiver.log; echo '```'; } \
              | tee run_report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Upload raw snapshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forex-run-${{ github.run_id }}
          path: |
            snapshots/
            archiver.log
            run_report.*
          if-no-files-found: warn
          retention-days: 90

      - name: Commit archive
        run: |
          git config user.name  "forex-archiver-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in data all_rates_history.csv dashboard/data.json snapshots/failures; do
            [ -e "$p" ] && git add "$p"
          done
          if git diff --staged --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "data: forex run $(date -u +'%Y-%m-%d') (${{ steps.run.outputs.exit_code == '0' && 'ok' || 'needs attention' }})"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep $((i * 5)); done
          exit 1

      - name: Open or update alert issue
        if: steps.run.outputs.needs_alert == 'true'
        run: |
          gh label create "$ALERT_LABEL" --color B60205 --description "Automated forex pipeline alert" 2>/dev/null || true
          body="$(cat run_report.md)

          [Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) · runbook: README → *Runbook*"
          num=$(gh issue list --label "$ALERT_LABEL" --state open --json number -q '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$body"
          else
            gh issue create --title "Forex archiver needs attention ($(date -u +%F))" --label "$ALERT_LABEL" --body "$body"
          fi

      - name: Close alert issue when healthy again
        if: steps.run.outputs.needs_alert == 'false'
        run: |
          for num in $(gh issue list --label "$ALERT_LABEL" --state open --json number -q '.[].number'); do
            gh issue close "$num" --comment "✅ Run ${{ github.run_id }} is healthy again: all sources fetched, no new anomalies."
          done

      - name: Telegram alert (optional)
        if: steps.run.outputs.needs_alert == 'true' && env.TG_TOKEN != ''
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode chat_id="$TG_CHAT" \
            --data-urlencode text="$(head -c 3500 run_report.md)" > /dev/null

      # A red X also triggers GitHub's own failure e-mail to the repo owner.
      - name: Fail the job if a source failed or a feed is stale
        if: steps.run.outputs.exit_code != '0'
        run: |
          echo "forex-archiver exited with ${{ steps.run.outputs.exit_code }} (1 = all sources failed, 2 = partial/stale)"
          exit 1
