[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forex-archiver"
version = "2.0.0"
description = "Multi-bank USD/INR rate archiver: Selenium/PDF/BeautifulSoup ingestion, SQLite upserts, anomaly detection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "pdfplumber>=0.10",
    "selenium>=4.18",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.6"]

[project.scripts]
forex-archiver = "forex_archiver.cli:main"

[tool.setuptools]
packages = ["forex_archiver", "forex_archiver.sources"]

[tool.setuptools.package-data]
forex_archiver = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["forex_archiver"]
omit = ["forex_archiver/__main__.py"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731"]
